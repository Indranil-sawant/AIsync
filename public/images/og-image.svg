<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Inner High-End Card -->
  <rect x="60" y="60" width="1080" height="510" rx="28" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Brand Mark Icon Box -->
  <g transform="translate(120, 110)">
    <rect width="84" height="84" rx="22" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <rect x="20" y="20" width="44" height="44" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="32" y="32" width="20" height="20" rx="5" fill="#4f46e5"/>
    <circle cx="42" cy="42" r="3.5" fill="#ffffff"/>
    <!-- Pins -->
    <path d="M42 6v8M42 70v8M6 42h8M70 42h8M28 6v8M28 70v8M56 6v8M56 70v8M6 28h8M70 28h8M6 56h8M70 56h8" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand Name Typography -->
  <text x="230" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">AISYNC<tspan fill="#6366f1">.</tspan></text>
  <text x="230" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="4">SOFTWARE SOLUTIONS</text>

  <!-- Geographic & Category Badge -->
  <g transform="translate(730, 126)">
    <rect width="330" height="38" rx="19" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="4.5" fill="#10b981"/>
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">Ratnagiri, Maharashtra, India</text>
  </g>

  <!-- Main Statement / Hero Typography -->
  <text x="120" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Software &amp; Website Development
  </text>
  <text x="120" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#818cf8" letter-spacing="-1">
    Engineered for Performance.
  </text>

  <!-- Subtitle Paragraph -->
  <text x="120" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Custom web applications, e-commerce platforms, business automation,
  </text>
  <text x="120" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    and digital systems built for modern enterprises.
  </text>

  <!-- Bottom Details & Domain -->
  <g transform="translate(120, 485)">
    <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#6366f1" letter-spacing="1">https://aisyncsoftware.in</text>
    <text x="730" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">Verified Engineering Firm</text>
  </g>
</svg>