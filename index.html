    <!-- Critical Preloader Styles (Instant 0ms First Paint) -->
    <style id="aisync-preloader-css">
      #aisync-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fcfbf8;
        background-image: radial-gradient(circle at 50% 45%, rgba(79, 70, 229, 0.07) 0%, rgba(252, 251, 248, 1) 70%);
        opacity: 1;
        visibility: visible;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
        will-change: opacity, transform;
        pointer-events: all;
        user-select: none;
        overflow: hidden;
      }
      #aisync-preloader.aisync-loaded {
        opacity: 0;
        transform: scale(1.02);
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-glow-ring {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 1px dashed rgba(79, 70, 229, 0.22);
        animation: preloader-spin 14s linear infinite;
        pointer-events: none;
      }
      .preloader-glow-ring::after {
        content: '';
        position: absolute;
        top: -3px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4f46e5;
        box-shadow: 0 0 10px #4f46e5, 0 0 20px #2563eb;
      }
      .preloader-logo-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
      }
      .preloader-logo-svg {
        animation: preloader-subtle-float 3s ease-in-out infinite;
        filter: drop-shadow(0 10px 25px rgba(37, 99, 235, 0.12));
      }
      .preloader-title {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #141f3d;
        margin: 0;
        line-height: 1.1;
      }
      .preloader-subtitle {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #4f46e5;
        margin-top: 6px;
        line-height: 1;
      }
      .preloader-progress-container {
        width: 220px;
        max-width: 80vw;
        height: 3px;
        background: rgba(20, 31, 61, 0.08);
        border-radius: 9999px;
        margin-top: 28px;
        overflow: hidden;
        position: relative;
      }
      .preloader-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4f46e5 0%, #2563eb 50%, #06b6d4 100%);
        border-radius: 9999px;
        box-shadow: 0 0 12px rgba(79, 70, 229, 0.5);
        transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .preloader-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 220px;
        max-width: 80vw;
        margin-top: 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: #64748b;
        letter-spacing: 0.05em;
      }
      .preloader-status-text {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .preloader-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #4f46e5;
        animation: preloader-pulse 1.4s ease-in-out infinite;
      }
      @keyframes preloader-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 8px #4f46e5; }
      }
      @keyframes preloader-subtle-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader-glow-ring, .preloader-logo-svg, .preloader-status-dot {
          animation: none !important;
        }
      }
    </style>
  </head>

        <div id="aisync-preloader-bar" class="preloader-progress-bar"></div>
      </div>

      <div class="preloader-meta-row">
        <div class="preloader-status-text">
          <span class="preloader-status-dot"></span>
          <span id="aisync-preloader-status">INITIALIZING</span>
        </div>
        <span id="aisync-preloader-pct">0%</span>
      </div>
    </div>

    <script>
      (function() {
        var bar = document.getElementById('aisync-preloader-bar');
        var pct = document.getElementById('aisync-preloader-pct');
        var status = document.getElementById('aisync-preloader-status');
        var preloader = document.getElementById('aisync-preloader');
        var currentPct = 12;
        var dismissed = false;

        function updateProgress(value, text) {
          if (!bar || !pct) return;
          currentPct = Math.min(100, Math.max(currentPct, value));
          bar.style.width = currentPct + '%';
          pct.textContent = Math.round(currentPct) + '%';
          if (text && status) status.textContent = text;
        }

        updateProgress(18, 'INITIALIZING');

        var interval = setInterval(function() {
          if (dismissed) return;
          if (currentPct < 40) {
            updateProgress(currentPct + 7, 'CONNECTING');
          } else if (currentPct < 75) {
            updateProgress(currentPct + 4, 'LOADING ASSETS');
          } else if (currentPct < 92) {
            updateProgress(currentPct + 1.5, 'STARTING SYSTEM');
          }
        }, 120);

        function dismiss() {
          if (dismissed) return;
          dismissed = true;
          clearInterval(interval);
          updateProgress(100, 'READY');
          setTimeout(function() {
            if (preloader) {
              preloader.classList.add('aisync-loaded');
              setTimeout(function() {
                preloader.style.display = 'none';
                preloader.setAttribute('aria-hidden', 'true');
              }, 550);
            }
          }, 200);
        }

        window.__AISYNC_DISMISS_PRELOADER__ = dismiss;

        // Fallback safety dismissal if scripts take longer or on slow network
        window.addEventListener('load', function() {
          setTimeout(dismiss, 350);
        });

        // Hard timeout maximum: 3 seconds guarantee
        setTimeout(dismiss, 3000);
      })();
    </script>
